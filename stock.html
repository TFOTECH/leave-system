<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเบิกอุปกรณ์สำนักงาน</title>
    <!-- ใช้ Tailwind CSS เพื่อความสวยงามและจัดเลย์เอาต์ง่าย -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- ใช้ SweetAlert2 สำหรับแจ้งเตือนสวยๆ -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- LINE LIFF SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <style>
        /* ซ่อน Scrollbar แต่ยังเลื่อนได้ */
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-gray-100 font-sans">

    <!-- Header -->
    <header class="bg-blue-600 text-white p-4 sticky top-0 z-50 flex justify-between items-center shadow-md">
        <h1 class="text-xl font-bold">📦 เบิกอุปกรณ์</h1>
        <button id="cartBtn" class="relative bg-blue-800 p-2 rounded-full hover:bg-blue-700 transition" onclick="toggleCart()">
            🛒 ตะกร้า
            <span id="cartBadge" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs font-bold px-2 py-1 rounded-full hidden">0</span>
        </button>
    </header>

    <!-- Loading Spinner -->
    <div id="loading" class="flex flex-col justify-center items-center h-[70vh]">
        <div class="animate-spin rounded-full h-12 w-12 border-b-4 border-blue-600"></div>
        <p class="mt-4 text-gray-600">กำลังโหลดรายการสิ่งของ...</p>
    </div>

    <!-- Product Grid -->
    <main class="p-4 mb-20 hidden" id="mainContent">
        <div id="productGrid" class="grid grid-cols-2 gap-4">
            <!-- สินค้าจะถูกนำมาแสดงตรงนี้ผ่าน JavaScript -->
        </div>
    </main>

    <!-- Cart Modal (หน้าต่างตะกร้าสินค้า) -->
    <div id="cartModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex-col justify-end">
        <div class="bg-white w-full h-[80vh] rounded-t-2xl p-4 flex flex-col">
            <div class="flex justify-between items-center border-b pb-3">
                <h2 class="text-xl font-bold">🛒 รายการที่ขอเบิก</h2>
                <button onclick="toggleCart()" class="text-gray-500 text-2xl font-bold">&times;</button>
            </div>
            
            <div id="cartItemsList" class="flex-1 overflow-y-auto py-4">
                <!-- รายการในตะกร้าจะแสดงที่นี่ -->
            </div>

            <div class="border-t pt-4">
                <button id="submitBtn" onclick="submitRequest()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl text-lg disabled:bg-gray-400">
                    ยืนยันการเบิกอุปกรณ์
                </button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // ⚠️ ตั้งค่า 2 ตัวแปรนี้ให้เป็นของคุณ ⚠️
        // ==========================================
        const LIFF_ID = "2011288511-uFk4BYwU"; 
        const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwSU87J8K2TDR90qCSMkUTMRoJC3cEeIMEB-hzRHcx1OaWGOs96zwYnGK5iA-y0dMGX/exec";

        let productList = [];
        let cart = {}; // เก็บข้อมูลตะกร้า { 'itemId': qty }
        let lineUserId = "";

        // เริ่มต้นการทำงานของ LIFF
        async function initializeLiff() {
            try {
                await liff.init({ liffId: LIFF_ID });
                if (!liff.isLoggedIn()) {
                    liff.login();
                } else {
                    const profile = await liff.getProfile();
                    lineUserId = profile.userId;
                    fetchProducts(); // ดึงข้อมูลสินค้าจาก Sheet
                }
            } catch (err) {
                console.error("LIFF Init Error: ", err);
                Swal.fire('ข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อ LINE ได้', 'error');
            }
        }

        // ดึงข้อมูลสินค้าจาก Google Apps Script
        async function fetchProducts() {
            try {
                const response = await fetch(`${GAS_WEBAPP_URL}?action=get_stock_items`);
                const result = await response.json();
                
                if (result.status === "success") {
                    productList = result.data;
                    renderProducts();
                    document.getElementById('loading').classList.add('hidden');
                    document.getElementById('mainContent').classList.remove('hidden');
                } else {
                    Swal.fire('ข้อผิดพลาด', 'ไม่สามารถโหลดข้อมูลได้', 'error');
                }
            } catch (error) {
                Swal.fire('ข้อผิดพลาด', 'เกิดปัญหาในการเชื่อมต่อเซิร์ฟเวอร์', 'error');
            }
        }

        // แสดงผลรายการสินค้า
        function renderProducts() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = "";

            productList.forEach(item => {
                const currentQty = cart[item.itemId] || 0;
                
                // ถ้ารูปไม่มีให้ใช้รูป Default
                const imgUrl = item.imageUrl ? item.imageUrl : 'https://placehold.co/400x400?text=No+Image';

                grid.innerHTML += `
                    <div class="bg-white rounded-xl shadow p-3 flex flex-col justify-between">
                        <div>
                            <img src="${imgUrl}" alt="${item.itemName}" class="w-full h-32 object-contain rounded-md mb-2">
                            <h3 class="text-sm font-bold text-gray-800 leading-tight h-10 overflow-hidden">${item.itemName}</h3>
                            <p class="text-xs text-gray-500 mt-1">คงเหลือ: ${item.inStock} ${item.unit}</p>
                        </div>
                        
                        <div class="mt-3 flex items-center justify-between bg-gray-100 rounded-lg p-1">
                            <button onclick="updateCart('${item.itemId}', -1)" class="w-8 h-8 bg-white rounded shadow text-red-500 font-bold">-</button>
                            <span id="qty-${item.itemId}" class="font-bold">${currentQty}</span>
                            <button onclick="updateCart('${item.itemId}', 1)" class="w-8 h-8 bg-white rounded shadow text-green-500 font-bold">+</button>
                        </div>
                    </div>
                `;
            });
        }

        // อัปเดตจำนวนในตะกร้า
        function updateCart(itemId, change) {
            const item = productList.find(p => p.itemId === itemId);
            let currentQty = cart[itemId] || 0;
            let newQty = currentQty + change;

            if (newQty < 0) newQty = 0;
            if (newQty > item.inStock) {
                Swal.fire('แจ้งเตือน', `เบิกได้สูงสุด ${item.inStock} ${item.unit} ครับ`, 'warning');
                return;
            }

            if (newQty === 0) {
                delete cart[itemId];
            } else {
                cart[itemId] = newQty;
            }

            document.getElementById(`qty-${itemId}`).innerText = newQty;
            updateCartBadge();
            renderCartModal();
        }

        // อัปเดตตัวเลขบนปุ่มตะกร้า
        function updateCartBadge() {
            const badge = document.getElementById('cartBadge');
            const totalItems = Object.values(cart).reduce((sum, qty) => sum + qty, 0);
            
            if (totalItems > 0) {
                badge.innerText = totalItems;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        // เปิด/ปิด หน้าต่างตะกร้า
        function toggleCart() {
            const modal = document.getElementById('cartModal');
            modal.classList.toggle('hidden');
            modal.classList.toggle('flex');
            renderCartModal();
        }

        // แสดงรายการในหน้าตะกร้า
        function renderCartModal() {
            const list = document.getElementById('cartItemsList');
            const btn = document.getElementById('submitBtn');
            list.innerHTML = "";

            if (Object.keys(cart).length === 0) {
                list.innerHTML = "<p class='text-center text-gray-500 mt-10'>ยังไม่มีรายการเบิก</p>";
                btn.disabled = true;
                return;
            }

            btn.disabled = false;
            for (const [itemId, qty] of Object.entries(cart)) {
                const item = productList.find(p => p.itemId === itemId);
                list.innerHTML += `
                    <div class="flex justify-between items-center mb-3 bg-gray-50 p-3 rounded-lg border">
                        <div class="flex-1">
                            <p class="font-bold text-sm">${item.itemName}</p>
                            <p class="text-xs text-gray-500">จำนวน: ${qty} ${item.unit}</p>
                        </div>
                        <button onclick="updateCart('${itemId}', -${qty})" class="text-red-500 text-sm font-bold ml-3">ลบ</button>
                    </div>
                `;
            }
        }

        // ส่งข้อมูลเบิกไปยัง Google Apps Script
        async function submitRequest() {
            if (Object.keys(cart).length === 0) return;

            // แปลงรูปแบบข้อมูลให้เข้ากับ Apps Script
            const itemsToRequest = Object.keys(cart).map(itemId => {
                return { itemId: itemId, qty: cart[itemId] };
            });

            const payload = {
                action: "request_stock",
                lineUid: lineUserId,
                itemsToRequest: itemsToRequest
            };

            document.getElementById('submitBtn').innerText = "กำลังส่งข้อมูล...";
            document.getElementById('submitBtn').disabled = true;

            try {
                const response = await fetch(GAS_WEBAPP_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                
                const result = await response.json();
                
                if (result.status === "success") {
                    Swal.fire({
                        title: 'สำเร็จ!',
                        text: 'ส่งคำขอเบิกอุปกรณ์เรียบร้อยแล้ว',
                        icon: 'success',
                        confirmButtonText: 'ปิดหน้าต่าง'
                    }).then(() => {
                        liff.closeWindow(); // ปิดหน้าต่าง LIFF อัตโนมัติเมื่อกด OK
                    });
                } else {
                    Swal.fire('ข้อผิดพลาด', result.message, 'error');
                    document.getElementById('submitBtn').innerText = "ยืนยันการเบิกอุปกรณ์";
                    document.getElementById('submitBtn').disabled = false;
                }
            } catch (error) {
                Swal.fire('ข้อผิดพลาด', 'ไม่สามารถส่งข้อมูลได้ กรุณาลองใหม่', 'error');
                document.getElementById('submitBtn').innerText = "ยืนยันการเบิกอุปกรณ์";
                document.getElementById('submitBtn').disabled = false;
            }
        }

        // เริ่มต้นการทำงานเมื่อโหลดหน้าเว็บเสร็จ
        window.onload = () => {
            initializeLiff();
        };
    </script>
</body>
</html>
