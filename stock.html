<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเบิกอุปกรณ์สำนักงาน</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        ::-webkit-scrollbar { display: none; }
        .category-btn.active { background-color: #2563eb; color: white; border-color: #2563eb; }
        .modal-slide-up { animation: slideUp 0.3s ease-out forwards; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    </style>
</head>
<body class="bg-gray-100 font-sans pb-24">

    <!-- Header -->
    <header class="bg-blue-600 text-white p-4 sticky top-0 z-50 flex justify-between items-center shadow-md">
        <h1 class="text-xl font-bold">📦 เบิกอุปกรณ์</h1>
        <button id="cartBtn" class="relative bg-blue-800 px-4 py-2 rounded-full hover:bg-blue-700 transition font-bold shadow-inner" onclick="toggleCart()">
            🛒 ตะกร้า
            <span id="cartBadge" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs font-bold px-2 py-1 rounded-full hidden">0</span>
        </button>
    </header>

    <!-- Search & Filter Bar -->
    <div class="bg-white px-4 py-3 shadow-sm sticky top-[60px] z-40">
        <input type="text" id="searchInput" onkeyup="renderProducts()" placeholder="🔍 ค้นหาอุปกรณ์..." class="w-full bg-gray-100 border border-gray-200 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 mb-3">
        <div id="categoryContainer" class="flex space-x-2 overflow-x-auto pb-1 whitespace-nowrap">
            <button onclick="setCategory('All')" class="category-btn active px-4 py-1.5 border border-gray-300 rounded-full text-sm font-semibold text-gray-600 shadow-sm">ทั้งหมด</button>
        </div>
    </div>

    <!-- Loading -->
    <div id="loading" class="flex flex-col justify-center items-center h-[50vh]">
        <div class="animate-spin rounded-full h-12 w-12 border-b-4 border-blue-600"></div>
        <p class="mt-4 text-gray-600 font-medium">กำลังโหลดแคตตาล็อก...</p>
    </div>

    <!-- Product Grid -->
    <main class="p-4 hidden" id="mainContent">
        <div id="productGrid" class="grid grid-cols-2 gap-4"></div>
        <p id="noResult" class="text-center text-gray-500 mt-10 hidden">❌ ไม่พบอุปกรณ์ที่ค้นหา</p>
    </main>

    <!-- Variant Selection Modal (หน้าต่างเลือกสี/ขนาด) -->
    <div id="variantModal" class="fixed inset-0 bg-black bg-opacity-60 z-50 hidden flex-col justify-end">
        <div class="bg-white w-full max-h-[70vh] rounded-t-2xl p-4 flex flex-col shadow-2xl modal-slide-up">
            <div class="flex justify-between items-center border-b pb-3 mb-3">
                <h2 id="variantGroupName" class="text-xl font-bold text-gray-800 line-clamp-1">เลือกตัวเลือก</h2>
                <button onclick="closeVariantModal()" class="text-gray-400 hover:text-red-500 text-3xl font-bold bg-gray-100 rounded-full w-8 h-8 flex items-center justify-center">&times;</button>
            </div>
            <div id="variantList" class="flex-1 overflow-y-auto pb-6 space-y-3">
                <!-- ตัวเลือกจะถูกสร้างอัตโนมัติ -->
            </div>
            <button onclick="closeVariantModal()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl mt-2 shadow-lg">ยืนยัน</button>
        </div>
    </div>

    <!-- Cart Modal (หน้าต่างตะกร้า) -->
    <div id="cartModal" class="fixed inset-0 bg-black bg-opacity-60 z-50 hidden flex-col justify-end">
        <div class="bg-white w-full h-[85vh] rounded-t-2xl p-4 flex flex-col shadow-2xl modal-slide-up">
            <div class="flex justify-between items-center border-b pb-4 mb-2">
                <h2 class="text-xl font-bold text-gray-800">🛒 ตะกร้าของคุณ</h2>
                <button onclick="toggleCart()" class="text-gray-400 hover:text-red-500 text-3xl font-bold">&times;</button>
            </div>
            <div id="cartItemsList" class="flex-1 overflow-y-auto py-2 space-y-3"></div>
            <div class="border-t pt-4">
                <button id="submitBtn" onclick="submitRequest()" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl text-lg disabled:bg-gray-400 shadow-lg flex items-center justify-center">
                    ยืนยันการเบิกอุปกรณ์
                </button>
            </div>
        </div>
    </div>

    <script>
        const LIFF_ID = "2011288511-uFk4BYwU"; 
        const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwSU87J8K2TDR90qCSMkUTMRoJC3cEeIMEB-hzRHcx1OaWGOs96zwYnGK5iA-y0dMGX/exec";

        let productList = [];
        let groupedProducts = [];
        let cart = {}; 
        let lineUserId = "";
        let currentCategory = 'All';

        async function initializeLiff() {
            try {
                await liff.init({ liffId: LIFF_ID });
                if (!liff.isLoggedIn()) { liff.login(); } 
                else {
                    lineUserId = (await liff.getProfile()).userId;
                    fetchProducts();
                }
            } catch (err) { Swal.fire('Error', err.message, 'error'); }
        }

        async function fetchProducts() {
            try {
                const res = await fetch(`${GAS_WEBAPP_URL}?action=get_stock_items`);
                const result = await res.json();
                if (result.status === "success") {
                    productList = result.data;
                    processGroupedProducts(); // ประมวลผลจัดกลุ่มสินค้า
                    generateCategories();
                    renderProducts();
                    document.getElementById('loading').classList.add('hidden');
                    document.getElementById('mainContent').classList.remove('hidden');
                }
            } catch (error) { Swal.fire('Error', 'โหลดข้อมูลไม่สำเร็จ', 'error'); }
        }

        // จัดกลุ่มสินค้าตาม Group_Name
        function processGroupedProducts() {
            const groups = {};
            productList.forEach(p => {
                const gName = (p.groupName && p.groupName.trim() !== "") ? p.groupName : p.itemName;
                if(!groups[gName]) {
                    groups[gName] = { 
                        groupName: gName, category: p.category, 
                        imageUrl: p.imageUrl, unit: p.unit, 
                        items: [], totalStock: 0 
                    };
                }
                groups[gName].items.push(p);
                groups[gName].totalStock += p.inStock;
            });
            groupedProducts = Object.values(groups);
        }

        function generateCategories() {
            const cats = [...new Set(groupedProducts.map(g => g.category).filter(c => c))];
            const container = document.getElementById('categoryContainer');
            cats.forEach(cat => {
                container.innerHTML += `<button onclick="setCategory('${cat}')" id="cat-${cat}" class="category-btn px-4 py-1.5 border border-gray-300 rounded-full text-sm font-semibold text-gray-600 shadow-sm">${cat}</button>`;
            });
        }

        function setCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active', 'text-white'));
            const activeBtn = cat === 'All' ? document.querySelector('.category-btn') : document.getElementById(`cat-${cat}`);
            if(activeBtn) activeBtn.classList.add('active');
            renderProducts();
        }

        // แสดงผลหน้าหลัก
        function renderProducts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const grid = document.getElementById('productGrid');
            grid.innerHTML = "";
            let matchCount = 0;

            groupedProducts.forEach(group => {
                const matchCat = currentCategory === 'All' || group.category === currentCategory;
                const matchSearch = group.groupName.toLowerCase().includes(query);

                if (matchCat && matchSearch) {
                    matchCount++;
                    const imgUrl = group.imageUrl || 'https://placehold.co/400x400?text=No+Image';
                    
                    // คำนวณยอดที่เลือกไปแล้วในกลุ่มนี้
                    const totalInCart = group.items.reduce((sum, item) => sum + (cart[item.itemId] || 0), 0);
                    let actionHtml = '';

                    // ถ้ามีแค่ชิ้นเดียวและไม่ได้ระบุตัวเลือก ให้โชว์ปุ่ม +/- เลย
                    if (group.items.length === 1 && !group.items[0].variantName) {
                        const item = group.items[0];
                        const qty = cart[item.itemId] || 0;
                        actionHtml = `
                            <div class="flex items-center justify-between bg-gray-50 rounded-xl p-1 border">
                                <button onclick="updateCart('${item.itemId}', -1)" class="w-8 h-8 bg-white rounded-lg shadow-sm text-red-500 font-bold text-lg">-</button>
                                <span id="qty-${item.itemId}" class="font-bold text-gray-700">${qty}</span>
                                <button onclick="updateCart('${item.itemId}', 1)" class="w-8 h-8 bg-blue-500 rounded-lg shadow-sm text-white font-bold text-lg">+</button>
                            </div>`;
                    } else {
                        // ถ้ามีหลายตัวเลือก โชว์ปุ่ม "เลือกรูปแบบ"
                        const badgeHtml = totalInCart > 0 ? `<span class="absolute -top-2 -right-2 bg-red-500 text-white text-xs font-bold px-2 py-0.5 rounded-full border-2 border-white">${totalInCart}</span>` : '';
                        actionHtml = `
                            <button onclick="openVariantModal('${group.groupName}')" class="relative w-full py-2.5 bg-blue-50 text-blue-700 font-bold text-sm rounded-xl border border-blue-200 hover:bg-blue-100 transition">
                                เลือกรูปแบบ ${badgeHtml}
                            </button>`;
                    }

                    grid.innerHTML += `
                        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-3 flex flex-col justify-between">
                            <div>
                                <img src="${imgUrl}" class="w-full h-28 object-contain rounded-md mb-2 bg-gray-50 p-2">
                                <h3 class="text-sm font-bold text-gray-800 leading-tight line-clamp-2">${group.groupName}</h3>
                                <p class="text-xs text-blue-600 mt-1 font-semibold">คงเหลือรวม: ${group.totalStock} ${group.unit}</p>
                            </div>
                            <div class="mt-3">${actionHtml}</div>
                        </div>`;
                }
            });
            document.getElementById('noResult').style.display = matchCount === 0 ? 'block' : 'none';
        }

        // หน้าต่างตัวเลือกสินค้า (Variants)
        function openVariantModal(groupName) {
            const group = groupedProducts.find(g => g.groupName === groupName);
            if(!group) return;

            document.getElementById('variantGroupName').innerText = groupName;
            const list = document.getElementById('variantList');
            list.innerHTML = '';

            group.items.forEach(item => {
                const qty = cart[item.itemId] || 0;
                const vName = item.variantName || item.itemName;
                list.innerHTML += `
                    <div class="flex justify-between items-center p-3 border rounded-xl bg-gray-50">
                        <div class="flex-1 pr-2">
                            <p class="font-bold text-gray-800 text-sm">${vName}</p>
                            <p class="text-xs text-gray-500">เหลือ: ${item.inStock} ${item.unit}</p>
                        </div>
                        <div class="flex items-center space-x-3 bg-white p-1 rounded-lg border shadow-sm">
                            <button onclick="updateCart('${item.itemId}', -1, true, '${groupName}')" class="w-8 h-8 rounded text-red-500 font-bold text-lg">-</button>
                            <span class="font-bold text-gray-700 w-4 text-center">${qty}</span>
                            <button onclick="updateCart('${item.itemId}', 1, true, '${groupName}')" class="w-8 h-8 rounded text-blue-600 font-bold text-lg">+</button>
                        </div>
                    </div>`;
            });
            document.getElementById('variantModal').classList.replace('hidden', 'flex');
        }

        function closeVariantModal() {
            document.getElementById('variantModal').classList.replace('flex', 'hidden');
            renderProducts(); // อัปเดตตัวเลขหน้าหลัก
        }

        // ระบบตะกร้า
        function updateCart(itemId, change, fromVariant = false, groupName = '') {
            const item = productList.find(p => p.itemId === itemId);
            let newQty = (cart[itemId] || 0) + change;

            if (newQty < 0) newQty = 0;
            if (newQty > item.inStock) {
                Swal.fire('แจ้งเตือน', `เบิกตัวเลือกนี้ได้สูงสุด ${item.inStock} ${item.unit} ครับ`, 'warning');
                return;
            }

            if (newQty === 0) delete cart[itemId];
            else cart[itemId] = newQty;

            updateCartBadge();
            
            if(fromVariant) openVariantModal(groupName); // Refresh popup
            else {
                const qtySpan = document.getElementById(`qty-${itemId}`);
                if(qtySpan) qtySpan.innerText = newQty;
            }

            if(!document.getElementById('cartModal').classList.contains('hidden')) renderCartModal();
        }

        function updateCartBadge() {
            const total = Object.values(cart).reduce((sum, q) => sum + q, 0);
            const badge = document.getElementById('cartBadge');
            badge.innerText = total;
            badge.classList.toggle('hidden', total === 0);
        }

        function toggleCart() {
            document.getElementById('cartModal').classList.toggle('hidden');
            document.getElementById('cartModal').classList.toggle('flex');
            renderCartModal();
        }

        function renderCartModal() {
            const list = document.getElementById('cartItemsList');
            const btn = document.getElementById('submitBtn');
            list.innerHTML = "";

            if (Object.keys(cart).length === 0) {
                list.innerHTML = `<div class="flex flex-col items-center justify-center h-full text-gray-400 mt-10"><span class="text-4xl mb-3">📭</span><p>ตะกร้าว่างเปล่า</p></div>`;
                btn.disabled = true; return;
            }

            btn.disabled = false;
            for (const [itemId, qty] of Object.entries(cart)) {
                const item = productList.find(p => p.itemId === itemId);
                const img = item.imageUrl || 'https://placehold.co/100x100?text=Img';
                const displayName = (item.groupName && item.variantName) ? `${item.groupName} (${item.variantName})` : item.itemName;
                
                list.innerHTML += `
                    <div class="flex justify-between items-center bg-white p-3 rounded-xl border shadow-sm">
                        <img src="${img}" class="w-12 h-12 rounded object-cover border mr-3 bg-gray-50">
                        <div class="flex-1">
                            <p class="font-bold text-sm text-gray-800 line-clamp-1">${displayName}</p>
                            <p class="text-xs text-gray-500">จำนวน: <span class="font-bold text-blue-600">${qty}</span> ${item.unit}</p>
                        </div>
                        <button onclick="updateCart('${itemId}', -${qty})" class="text-red-500 bg-red-50 px-3 py-1.5 rounded-lg text-xs font-bold border border-red-100 ml-2">ลบ</button>
                    </div>`;
            }
        }

        async function submitRequest() {
            if (Object.keys(cart).length === 0) return;
            const btn = document.getElementById('submitBtn');
            btn.innerHTML = '<div class="animate-spin w-5 h-5 border-[3px] border-white border-t-transparent rounded-full mr-2"></div> กำลังส่งคำขอ...';
            btn.disabled = true;

            const payload = {
                action: "request_stock", lineUid: lineUserId,
                itemsToRequest: Object.keys(cart).map(id => ({ itemId: id, qty: cart[id] }))
            };

            try {
                const res = await fetch(GAS_WEBAPP_URL, { method: 'POST', body: JSON.stringify(payload) });
                const result = await res.json();
                if (result.status === "success") {
                    Swal.fire({ title: 'สำเร็จ!', text: 'ส่งคำขอเบิกอุปกรณ์เรียบร้อยแล้ว', icon: 'success', confirmButtonText: 'ตกลง' })
                    .then(() => liff.closeWindow());
                } else throw new Error(result.message);
            } catch (err) {
                Swal.fire('ข้อผิดพลาด', err.message || 'ไม่สามารถส่งข้อมูลได้', 'error');
                btn.innerText = "ยืนยันการเบิกอุปกรณ์"; btn.disabled = false;
            }
        }
        window.onload = () => { initializeLiff(); };
    </script>
</body>
</html>
