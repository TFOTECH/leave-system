<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บันทึกงานคนขับรถ</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body style="font-family: sans-serif; text-align: center; padding: 20px;">
    
    <div id="statusText">⏳ กำลังตรวจสอบสิทธิ์...</div>
    
    <div id="workForm" style="display: none; max-width: 300px; margin: auto;">
        <h3 style="color: #4CAF50;">สวัสดี, <span id="empName"></span></h3>
        <p>รหัส: <span id="empIdDisplay"></span></p>
        
        <select id="actionType" style="width: 100%; padding: 10px; margin-bottom: 10px;">
            <option value="เข้างาน">📍 เข้างาน (Start)</option>
            <option value="ส่งของ">📦 ส่งของ (Drop-off)</option>
            <option value="เลิกงาน">🏠 เลิกงาน (End)</option>
        </select>
        
        <button onclick="startScanner()" style="width: 100%; padding: 10px; background: #2196F3; color: white; border: none;">📷 สแกน QR Code</button>
        <div id="reader" style="margin-top: 15px;"></div>
    </div>

    <script>
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxY_xoLVweKmjXgFCq-jWpuQ6OF3Ye5Re_oXh6-fh8sqVbAtCSoysXfNSHPi58VqQt97g/exec"; // URL ตัวเดียวกันกับหน้า Register
        let currentEmpId = "";

        async function main() {
            await liff.init({ liffId: "2011288511-4Tt1UMUG" }); // ใส่ LIFF ID (อาจใช้คนละตัวกับ Register หรือตัวเดียวกันก็ได้)
            if (!liff.isLoggedIn()) { liff.login(); return; }
            const profile = await liff.getProfile();
            
            fetch(GAS_API_URL, {
                method: 'POST',
                body: JSON.stringify({ action: "checkLogin", lineId: profile.userId }),
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === "success") {
                    document.getElementById('statusText').style.display = 'none';
                    document.getElementById('workForm').style.display = 'block';
                    document.getElementById('empName').innerText = data.name;
                    document.getElementById('empIdDisplay').innerText = data.empId;
                    currentEmpId = data.empId;
                } else {
                    alert("❌ คุณยังไม่ได้ลงทะเบียน กรุณาลงทะเบียนก่อนครับ");
                    window.location.href = "register.html"; // เด้งไปหน้าลงทะเบียน
                }
            });
        }

        function startScanner() {
            navigator.geolocation.getCurrentPosition(position => {
                document.getElementById('statusText').style.display = 'block';
                document.getElementById('statusText').innerText = "✅ เปิดกล้องแล้ว สแกนได้เลย!";
                
                const html5QrCode = new Html5Qrcode("reader");
                html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (decodedText) => {
                    html5QrCode.stop();
                    document.getElementById('statusText').innerText = "🚀 กำลังบันทึกข้อมูล...";
                    
                    fetch(GAS_API_URL, {
                        method: 'POST',
                        body: JSON.stringify({
                            action: "saveLog",
                            empId: currentEmpId,
                            actionType: document.getElementById('actionType').value,
                            qrData: decodedText,
                            lat: position.coords.latitude,
                            lng: position.coords.longitude
                        }),
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                    })
                    .then(res => res.json())
                    .then(data => { alert(data.message); window.location.reload(); });
                }, () => {});
            }, () => alert("❌ กรุณาเปิด Location/GPS ในมือถือด้วยครับ"));
        }
        main();
    </script>
</body>
</html>
