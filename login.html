<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ระบบบันทึกงานคนขับรถ</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Sarabun', sans-serif;
      background: linear-gradient(135deg, #f0fdf4 0%, #dbeafe 100%);
      margin: 0; padding: 20px;
      display: flex; justify-content: center; align-items: flex-start; min-height: 100vh;
      box-sizing: border-box;
    }
    .card {
      background-color: #ffffff;
      width: 100%; max-width: 400px;
      border-radius: 20px; padding: 25px 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      text-align: center; margin-top: 10px;
    }
    h2 {
      margin-top: 0; font-size: 24px; font-weight: 700;
      color: #0369a1; margin-bottom: 20px;
    }
    .profile-box {
      background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px;
      padding: 15px; margin-bottom: 20px; text-align: left;
    }
    .profile-box .name { font-size: 18px; font-weight: 700; color: #0f172a; margin-bottom: 5px; }
    .profile-box .emp-id { font-size: 15px; color: #64748b; font-weight: 600; }
    
    select {
      width: 100%; padding: 15px; font-size: 16px;
      border: 2px solid #e2e8f0; border-radius: 12px;
      margin-bottom: 20px; font-family: 'Sarabun', sans-serif;
      font-weight: 600; color: #334155; outline: none;
    }
    select:focus { border-color: #0ea5e9; }

    button.scan-btn {
      width: 100%; padding: 15px; font-size: 18px; border: none; border-radius: 12px;
      cursor: pointer; font-family: 'Sarabun', sans-serif; font-weight: 600;
      background: linear-gradient(135deg, #0284c7, #2563eb); color: #ffffff;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3); transition: 0.3s;
    }
    button.scan-btn:disabled { background: #cbd5e1; box-shadow: none; cursor: not-allowed; }
    
    #reader { width: 100%; margin-top: 20px; border-radius: 12px; overflow: hidden; }
    #status { margin-top: 15px; font-size: 15px; font-weight: 600; }
    .loading-page { color: #0284c7; font-size: 18px; font-weight: bold; margin-top: 50px; text-align: center; line-height: 1.5; }
    .error-box { color: #dc2626; font-size: 14px; background: #fef2f2; padding: 10px; border-radius: 8px; margin-top: 10px; word-wrap: break-word;}
  </style>
</head>
<body>

  <div id="loadingScreen" class="loading-page">⏳ กำลังตรวจสอบสิทธิ์การใช้งาน...</div>

  <div class="card" id="mainScreen" style="display: none;">
    <h2>ระบบบันทึกงานคนขับรถ</h2>
    
    <div class="profile-box">
      <div class="name">👤 <span id="displayName">-</span></div>
      <div class="emp-id">รหัสพนักงาน: <span id="displayEmpId">-</span></div>
    </div>
    
    <select id="actionType">
      <option value="เข้างาน">📍 บันทึกเข้างาน (Start)</option>
      <option value="ส่งของ">📦 บันทึกส่งของ (Drop-off)</option>
      <option value="เลิกงาน">🏠 บันทึกเลิกงาน (End)</option>
    </select>
    
    <button id="scanBtn" class="scan-btn" onclick="startScanner()">📷 สแกน QR และบันทึกพิกัด</button>
    
    <div id="status"></div>
    <div id="reader"></div>
  </div>

  <script>
    var LIFF_ID = "2011288511-4Tt1UMUG"; 
    
    // ⚠️ เอา URL จากหน้า register.html มาวางทับตรงนี้ให้ตรงกันเป๊ะๆ
    var GAS_URL = "https://script.google.com/macros/s/AKfycbxISiISzLVfO0eD8_a_W8cj8_hl8jEYr6VgItKvrV3yUo7lBh5rwmdEPs7fnPfqe3xk/exec";
    
    var currentEmpId = "";

    window.onload = async function() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
          liff.login();
        } else {
          const profile = await liff.getProfile();
          
          fetch(GAS_URL, {
            method: 'POST',
            body: JSON.stringify({ action: "checkLogin", lineId: profile.userId }),
            headers: { 'Content-Type': 'text/plain;charset=utf-8' }
          })
          .then(res => res.text()) // เปลี่ยนเป็นดึง Text ก่อนเพื่อดัก Error
          .then(text => {
            try {
              let data = JSON.parse(text);
              if (data.status === "success") {
                currentEmpId = data.empId;
                document.getElementById("displayName").innerText = data.name;
                document.getElementById("displayEmpId").innerText = data.empId;
                
                document.getElementById("loadingScreen").style.display = "none";
                document.getElementById("mainScreen").style.display = "block";
              } else {
                alert("⚠️ ท่านยังไม่ได้ลงทะเบียนใช้งานระบบ");
                window.location.href = "register.html"; 
              }
            } catch(e) {
              document.getElementById("loadingScreen").innerHTML = `❌ การเชื่อมต่อผิดพลาด<br><div class="error-box">ลืมเปลี่ยนลิงก์ GAS_URL หรือสิทธิ์ไม่ถูกต้อง<br>รายละเอียด: ${text.substring(0, 100)}...</div>`;
            }
          })
          .catch((err) => {
            document.getElementById("loadingScreen").innerHTML = `❌ เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์<br><div class="error-box">${err.message}</div>`;
          });
        }
      } catch (err) {
        document.getElementById("loadingScreen").innerHTML = `❌ LINE Error<br><div class="error-box">${err.message}</div>`;
      }
    };

    let html5QrCode;

    function startScanner() {
      const statusDiv = document.getElementById("status");
      const scanBtn = document.getElementById("scanBtn");
      
      scanBtn.disabled = true;
      statusDiv.innerHTML = "<span style='color:#0284c7;'>⏳ กำลังค้นหาตำแหน่ง GPS...<br>(กรุณากดอนุญาตการเข้าถึงตำแหน่ง)</span>";

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          position => {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            statusDiv.innerHTML = "<span style='color:#059669;'>✅ ได้พิกัดแล้ว กำลังเปิดกล้อง...</span>";

            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
              { facingMode: "environment" },
              { fps: 10, qrbox: { width: 250, height: 250 } },
              (decodedText) => {
                html5QrCode.stop().then(() => {
                  document.getElementById("reader").style.display = "none";
                  statusDiv.innerHTML = "<span style='color:#0284c7; font-size:18px;'>🚀 กำลังส่งข้อมูลไปยังระบบ...</span>";
                  
                  const actionType = document.getElementById('actionType').value;
                  
                  fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                      action: "saveLog",
                      empId: currentEmpId,
                      actionType: actionType,
                      qrData: decodedText,
                      lat: lat,
                      lng: lng
                    }),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                  })
                  .then(res => res.json())
                  .then(res => {
                    if(res.status === "success") {
                      statusDiv.innerHTML = "<span style='color:#059669; font-size: 18px; display:block; padding: 15px; background: #f0fdf4; border-radius: 8px;'>🎉 บันทึกข้อมูลสำเร็จ!</span>";
                      setTimeout(() => { liff.closeWindow(); }, 2500);
                    } else {
                      statusDiv.innerHTML = "<span style='color:#dc2626;'>❌ " + res.message + "</span>";
                      scanBtn.disabled = false;
                    }
                  }).catch(() => {
                    statusDiv.innerHTML = "<span style='color:#dc2626;'>❌ บันทึกไม่สำเร็จ ลิงก์ API อาจมีปัญหา</span>";
                    scanBtn.disabled = false;
                  });
                });
              },
              (errorMessage) => {}
            ).catch((err) => {
              statusDiv.innerHTML = "<span style='color:#dc2626;'>❌ ไม่สามารถเปิดกล้องได้ กรุณาอนุญาตการเข้าถึงกล้อง</span>";
              scanBtn.disabled = false;
            });
          },
          error => {
            statusDiv.innerHTML = "<span style='color:#dc2626;'>❌ ระบบต้องการพิกัด GPS<br>กรุณาเปิด Location ในมือถือและกดอนุญาตครับ</span>";
            scanBtn.disabled = false;
          },
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
      } else {
        statusDiv.innerHTML = "<span style='color:#dc2626;'>❌ เบราว์เซอร์นี้ไม่รองรับ GPS</span>";
      }
    }
  </script>
</body>
</html>
