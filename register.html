<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Sarabun', sans-serif;
      background: linear-gradient(135deg, #e0f2fe 0%, #dcfce7 100%);
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .card {
      background-color: #ffffff;
      width: 92%;
      max-width: 400px;
      border-radius: 20px;
      padding: 35px 25px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      text-align: center;
      box-sizing: border-box;
    }
    h2 {
      margin-top: 0;
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(90deg, #059669, #2563eb);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .subtitle {
      color: #64748b;
      margin-bottom: 25px;
      font-size: 15px;
    }
    input {
      width: 100%;
      padding: 15px;
      font-size: 18px;
      text-align: center;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      box-sizing: border-box;
      margin-bottom: 20px;
      font-family: 'Sarabun', sans-serif;
      letter-spacing: 1px;
    }
    input:focus {
      outline: none;
      border-color: #059669;
      box-shadow: 0 0 0 4px rgba(5, 150, 105, 0.1);
    }
    button {
      width: 100%;
      padding: 15px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-family: 'Sarabun', sans-serif;
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(0, 185, 0, 0.2);
    }
    button:disabled {
      background-color: #e2e8f0;
      color: #94a3b8;
      cursor: not-allowed;
      box-shadow: none;
    }
    button:not(:disabled) {
      background: linear-gradient(135deg, #00B900, #059669);
      color: #ffffff;
    }
    #status {
      margin-top: 15px;
      font-size: 15px;
      font-weight: 600;
    }
    .error { color: #dc2626; font-size: 14px; display: block; padding: 10px; background: #fef2f2; border-radius: 8px; margin-top: 10px; }
    .success { color: #059669; }
  </style>
</head>
<body>
  <div class="card" id="mainCard">
    <h2>ลงทะเบียนใช้งาน</h2>
    <div class="subtitle" id="subtitleText">กรุณากรอกรหัสพนักงานของคุณ</div>
    
    <div id="formSection">
      <!-- ตั้งให้กรอกได้สูงสุด 7 หลัก และเช็คความยาวทันทีที่พิมพ์ -->
      <input type="text" id="empId" placeholder="กรอกรหัส 6-7 หลัก" maxlength="7" oninput="checkInputLength()">
      
      <button id="btn" onclick="register()" disabled>ลงทะเบียน</button>
    </div>
    
    <div id="status"></div>
  </div>

  <script>
    var userId = "";
    // อัปเดต LIFF ID เป็นตัวล่าสุดตามที่คุณแจ้งมา
    var LIFF_ID = "2011288511-CGAR9Z4m"; 
    // ลิงก์ API ของ Google Apps Script ตัวเดิม
    var GAS_URL = "https://script.google.com/macros/s/AKfycbweMZuauM0sZrAc3MPIDM6DKfSh3TO2toFFwSj6uzDEAxFYcsigI3XeMy-OLQIbN0E1wA/exec";

    // เมื่อเปิดแอปมา แค่ดึง Line ID แล้วรอให้ผู้ใช้พิมพ์รหัสเอง (ไม่ซ่อนฟอร์ม)
    window.onload = async function() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
          liff.login();
        } else {
          const profile = await liff.getProfile();
          userId = profile.userId;
        }
      } catch (err) {
        document.getElementById("status").innerHTML = "<span class='error'>LINE Error: " + err.message + "</span>";
      }
    };

    // ฟังก์ชันปลดล็อกปุ่มเมื่อพิมพ์ครบ 6 หลักขึ้นไป
    function checkInputLength() {
      var empId = document.getElementById("empId").value.trim();
      var btn = document.getElementById("btn");
      
      if (empId.length >= 6) { 
        btn.disabled = false; // ปลดล็อกปุ่ม
      } else {
        btn.disabled = true; // ล็อกปุ่มไว้
      }
    }

    // ฟังก์ชันทำงานเมื่อกดปุ่ม "ลงทะเบียน"
    function register() {
      var empId = document.getElementById("empId").value.trim();
      var btn = document.getElementById("btn");
      var statusDiv = document.getElementById("status");

      if (!userId) {
        statusDiv.innerHTML = "<span class='error'>ไม่พบ LINE ID กรุณาเปิดผ่านแอป LINE</span>";
        return;
      }

      // ล็อกปุ่มและขึ้นข้อความกำลังตรวจสอบ
      btn.disabled = true;
      statusDiv.innerHTML = "<span style='color:#0284c7; font-weight: 600;'>⏳ กำลังตรวจสอบและบันทึกข้อมูล...</span>";

      // ยิงข้อมูลไปให้ Google Apps Script เช็คและบันทึก
      fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify({ action: "registerLineId", empId: empId, lineId: userId }),
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }
      })
      .then(res => res.json())
      .then(res => {
        if (res.status === "success") {
          statusDiv.innerHTML = "<span class='success' style='font-size: 16px; display:block; padding: 10px; background: #f0fdf4; border-radius: 8px; border: 1px solid #bbf7d0;'>🎉 " + res.message + "</span>";
          // ปิดหน้าต่างหลังจากลงทะเบียนสำเร็จ 2 วินาที
          setTimeout(() => { liff.closeWindow(); }, 2000); 
        } else {
          statusDiv.innerHTML = "<span class='error'>⚠️ " + res.message + "</span>";
          btn.disabled = false; // เปิดปุ่มให้กดลองใหม่ได้
        }
      })
      .catch(() => {
        statusDiv.innerHTML = "<span class='error'>❌ เกิดข้อผิดพลาดในการเชื่อมต่อ กรุณาลองใหม่</span>";
        btn.disabled = false;
      });
    }
  </script>
</body>
</html>
