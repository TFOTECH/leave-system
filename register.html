<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Sarabun', sans-serif;
      background: linear-gradient(135deg, #e0f2fe 0%, #dcfce7 100%);
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background-color: #ffffff;
      width: 100%;
      max-width: 400px;
      border-radius: 20px;
      padding: 35px 25px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      text-align: center;
      box-sizing: border-box;
    }
    h2 {
      margin-top: 0;
      font-size: 26px;
      font-weight: 700;
      background: linear-gradient(90deg, #0284c7, #2563eb);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .subtitle {
      color: #64748b;
      margin-bottom: 25px;
      font-size: 15px;
    }
    input {
      width: 100%;
      padding: 15px;
      font-size: 20px;
      text-align: center;
      border: 2px solid #059669;
      border-radius: 12px;
      box-sizing: border-box;
      margin-bottom: 20px;
      font-family: 'Sarabun', sans-serif;
      letter-spacing: 2px;
      color: #1e293b;
    }
    input:focus {
      outline: none;
      box-shadow: 0 0 0 4px rgba(5, 150, 105, 0.1);
    }
    input:disabled {
      background-color: #f1f5f9;
      border-color: #cbd5e1;
      color: #64748b;
      cursor: not-allowed;
    }
    
    #infoBoxWrapper {
      display: none; 
      margin-bottom: 20px;
    }
    .emp-box {
      background: #f8fafc;
      border: 1px dashed #cbd5e1;
      border-radius: 12px;
      padding: 20px 15px;
    }
    .emp-name {
      color: #0284c7;
      font-weight: 700;
      font-size: 18px;
      margin-bottom: 5px;
    }
    .emp-dept {
      color: #475569;
      font-size: 15px;
      margin-bottom: 15px;
      font-weight: 600;
    }
    .alert-warning {
      background: #fef2f2;
      color: #dc2626;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.4;
    }

    button {
      width: 100%;
      padding: 15px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-family: 'Sarabun', sans-serif;
      font-weight: 600;
      transition: 0.3s;
    }
    button:disabled {
      background-color: #e2e8f0;
      color: #94a3b8;
      cursor: not-allowed;
      box-shadow: none;
    }
    button:not(:disabled) {
      background: linear-gradient(135deg, #059669, #10b981);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(5, 150, 105, 0.2);
    }
    #status { margin-top: 15px; font-size: 15px; font-weight: 600; }
    .error { color: #dc2626; font-size: 14px; display: block; padding: 10px; background: #fef2f2; border-radius: 8px;}
    .success { color: #059669; }
  </style>
</head>
<body>
  <div class="card">
    <h2>ลงทะเบียนใช้งาน</h2>
    <div class="subtitle">กรุณากรอกรหัสพนักงานของคุณ</div>
    
    <input type="text" id="empId" placeholder="กรอกรหัสพนักงาน" maxlength="7" oninput="checkData()">
    
    <div id="infoBoxWrapper">
      <div id="infoBoxContent"></div>
    </div>
    
    <button id="btn" onclick="register()" disabled>ลงทะเบียน</button>
    <div id="status"></div>
  </div>

  <script>
    var userId = "";
    var LIFF_ID = "2011288511-CGAR9Z4m"; 
    
    // ⚠️ ถ้าคุณได้ลิงก์ใหม่จาก Google อย่าลืมเอามาเปลี่ยนบรรทัดนี้นะครับ
    var GAS_URL = "https://script.google.com/macros/s/AKfycbxmpB3o0vTZwsFocnEe5VWDydWpmkTXN3H665SDPIvjF1IegvYl0s4dNiNTyMWfZE6J_Q/exec";
    
    var isUserAlreadyRegistered = false; 

    window.onload = async function() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
          liff.login();
        } else {
          const profile = await liff.getProfile();
          userId = profile.userId;

          fetch(GAS_URL, {
            method: 'POST',
            body: JSON.stringify({ action: "checkLogin", lineId: userId }),
            headers: { 'Content-Type': 'text/plain;charset=utf-8' }
          })
          .then(res => res.text()) // ดึงแบบ Text เผื่อ Error
          .then(text => {
            try {
              let data = JSON.parse(text);
              if (data.status === "success") {
                isUserAlreadyRegistered = true;
                var empInput = document.getElementById("empId");
                empInput.value = data.empId;
                empInput.disabled = true;
                
                var wrapper = document.getElementById("infoBoxWrapper");
                var content = document.getElementById("infoBoxContent");
                wrapper.style.display = "block";
                content.innerHTML = `<div class="emp-box">
                                       <div class="emp-name">👤 คุณ ${data.name}</div>
                                       <div class="alert-warning" style="margin-top: 15px;">⚠️ ท่านได้ใช้ LINE ID นี้ลงทะเบียนในระบบไปแล้ว!</div>
                                     </div>`;
                document.getElementById("btn").disabled = true;
              }
            } catch(e) {} // เงียบไว้ถ้ายังไม่เคยลงทะเบียน
          });
        }
      } catch (err) {
        document.getElementById("status").innerHTML = "<span class='error'>LINE Error: " + err.message + "</span>";
      }
    };

    let timer;
    async function checkData() {
      if (isUserAlreadyRegistered) return;
      
      clearTimeout(timer);
      var empId = document.getElementById("empId").value.trim();
      var wrapper = document.getElementById("infoBoxWrapper");
      var content = document.getElementById("infoBoxContent");
      var btn = document.getElementById("btn");
      document.getElementById("status").innerHTML = "";

      if (empId.length >= 6) {
        wrapper.style.display = "block";
        content.innerHTML = "<span style='color: #0284c7; font-weight: 600;'>🔍 กำลังค้นหาข้อมูลพนักงาน...</span>";
        btn.disabled = true;

        timer = setTimeout(async () => {
          try {
            let response = await fetch(GAS_URL, {
              method: 'POST',
              body: JSON.stringify({ action: "getEmployeeInfo", empId: empId }),
              headers: { 'Content-Type': 'text/plain;charset=utf-8' }
            });
            
            // ดักจับ Error หาก Google คืนหน้าล็อกอินมาแทน JSON
            let text = await response.text();
            let res;
            try {
              res = JSON.parse(text);
            } catch (err) {
              content.innerHTML = "<span class='error'>❌ ลิงก์ API หมดอายุ หรือลืมตั้งค่าสิทธิ์ให้เป็น 'ทุกคน (Anyone)' ใน Google Apps Script ครับ</span>";
              btn.disabled = true;
              return;
            }

            if (res.status === "success") {
              let html = `<div class="emp-box">
                            <div class="emp-name">👤 คุณ ${res.name}</div>
                            <div class="emp-dept">แผนก : ${res.department || '-'}</div>`;
              
              if (res.currentLineId && res.currentLineId !== "") {
                html += `<div class="alert-warning">⚠️ รหัสพนักงานนี้ถูกลงทะเบียนด้วย LINE อื่นไปแล้ว</div>`;
                btn.disabled = true;
              } else {
                btn.disabled = false;
              }
              
              html += `</div>`;
              content.innerHTML = html;
            } else {
              content.innerHTML = "<span class='error'>❌ ไม่พบรหัสพนักงานนี้ในระบบ</span>";
              btn.disabled = true;
            }
          } catch (error) {
            content.innerHTML = `<span class='error'>❌ การเชื่อมต่อล้มเหลว กรุณาลองใหม่</span>`;
            btn.disabled = true;
          }
        }, 800); 
      } else {
        wrapper.style.display = "none";
        content.innerHTML = "";
        btn.disabled = true;
      }
    }

    function register() {
      var empId = document.getElementById("empId").value.trim();
      var btn = document.getElementById("btn");
      var statusDiv = document.getElementById("status");

      btn.disabled = true;
      statusDiv.innerHTML = "<span style='color:#0284c7; font-weight: 600;'>⏳ กำลังบันทึกข้อมูล...</span>";

      fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify({ action: "registerLineId", empId: empId, lineId: userId }),
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }
      })
      .then(res => res.json())
      .then(res => {
        if (res.status === "success") {
          statusDiv.innerHTML = "<span class='success' style='font-size: 16px; display:block; padding: 10px; background: #f0fdf4; border-radius: 8px; border: 1px solid #bbf7d0;'>🎉 " + res.message + "</span>";
          setTimeout(() => { liff.closeWindow(); }, 2000); 
        } else {
          statusDiv.innerHTML = "<span class='error'>⚠️ " + res.message + "</span>";
          btn.disabled = false;
        }
      })
      .catch(() => {
        statusDiv.innerHTML = "<span class='error'>❌ เกิดข้อผิดพลาดในการบันทึก</span>";
        btn.disabled = false;
      });
    }
  </script>
</body>
</html>
