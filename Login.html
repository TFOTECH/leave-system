<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบลงเวลาและส่งงาน</title>
  <!-- ดึงไลบรารีสำหรับสแกน QR Code -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { font-family: 'Sarabun', sans-serif; background-color: #f4f7f6; padding: 20px; text-align: center; }
    .container { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 400px; margin: 0 auto; }
    h3 { color: #333; margin-top: 0; }
    input, select, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; font-size: 16px; }
    button { background-color: #4CAF50; color: white; border: none; font-weight: bold; cursor: pointer; }
    button:active { background-color: #45a049; }
    #reader { width: 100%; margin-top: 15px; }
    #statusInfo { margin-top: 15px; color: #d9534f; font-weight: bold; }
  </style>
</head>
<body>

  <div class="container">
    <h3>🚚 ระบบบันทึกงานคนขับรถ</h3>
    
    <input type="text" id="empId" placeholder="ใส่รหัสพนักงาน (เช่น 100001)">
    
    <select id="actionType">
      <option value="เข้างาน">📍 เข้างาน (Start)</option>
      <option value="ส่งของ">📦 ส่งของ (Drop-off)</option>
      <option value="เลิกงาน">🏠 เลิกงาน (End)</option>
    </select>
    
    <button onclick="startScanner()">📷 สแกน QR และบันทึกพิกัด</button>
    
    <div id="statusInfo"></div>
    <div id="reader"></div>
  </div>

  <script>
    let html5QrCode;

    function startScanner() {
      const empId = document.getElementById('empId').value;
      if (!empId) { alert("⚠️ กรุณาใส่รหัสพนักงานก่อนครับ!"); return; }

      const statusInfo = document.getElementById('statusInfo');
      statusInfo.innerText = "⏳ กำลังค้นหาตำแหน่ง GPS...";

      // 1. ดึงพิกัด GPS ก่อน
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(position => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          statusInfo.innerText = "✅ ได้พิกัดแล้ว กำลังเปิดกล้อง...";

          // 2. เปิดกล้องสแกน QR Code
          html5QrCode = new Html5Qrcode("reader");
          html5QrCode.start(
            { facingMode: "environment" }, // ใช้กล้องหลังมือถือ
            { fps: 10, qrbox: { width: 250, height: 250 } },
            (decodedText) => {
              // 3. เมื่อสแกนเจอ ให้ปิดกล้องและส่งข้อมูลไปบันทึก
              html5QrCode.stop();
              statusInfo.innerText = "🚀 กำลังบันทึกข้อมูล...";
              
              const actionType = document.getElementById('actionType').value;
              
              google.script.run.withSuccessHandler(res => {
                alert(res.message);
                statusInfo.innerText = "🎉 เสร็จสิ้น!";
                document.getElementById('empId').value = ""; // เคลียร์ช่องพิมพ์
              }).saveLogData(empId, actionType, decodedText, lat, lng);
            },
            (error) => { /* ข้าม error ยิบย่อยระหว่างยังหา QR ไม่เจอ */ }
          );
        }, error => {
          alert("❌ ระบบต้องการพิกัด กรุณาเปิด Location/GPS ในมือถือด้วยครับ");
          statusInfo.innerText = "";
        });
      } else {
        alert("บราวเซอร์นี้ไม่รองรับระบบ GPS");
      }
    }
  </script>
</body>
</html>
